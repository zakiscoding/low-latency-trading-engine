# mos-imac (Apple M1). Only the tick store runs in Colima: its VM drops most
# outbound connections, so the engine, paper exchange, telemetry uplink and
# recorder run natively on macOS under launchd (deploy/macos/). QuestDB only takes
# local connections, which Colima's port forwarding handles fine.
#
#   docker-compose -p lle -f compose.imac.yml up -d
services:
  questdb:
    image: questdb/questdb:9.1.0
    restart: unless-stopped
    environment:
      JVM_PREPEND: "-Xms64m -Xmx256m"
      QDB_TELEMETRY_ENABLED: "false"
    ports:
      - "127.0.0.1:9000:9000"   # console/REST, localhost only
      - "127.0.0.1:9009:9009"   # ILP from the native recorder
    volumes:
      - questdb-data:/var/lib/questdb
    mem_limit: 512m

volumes:
  questdb-data:
