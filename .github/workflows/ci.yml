name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  paper-only-guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: No live trading URLs anywhere in the repo
        run: python3 tools/check_no_live_urls.py

  build-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc-release
            cmake: -DCMAKE_CXX_COMPILER=g++-14
          - name: clang-release
            cmake: -DCMAKE_CXX_COMPILER=clang++-18
          - name: asan-ubsan
            cmake: -DCMAKE_CXX_COMPILER=g++-14 -DCMAKE_BUILD_TYPE=Debug -DLLE_SANITIZE=address,undefined -DLLE_NATIVE=OFF
          - name: tsan
            cmake: -DCMAKE_CXX_COMPILER=clang++-18 -DCMAKE_BUILD_TYPE=Debug -DLLE_SANITIZE=thread -DLLE_NATIVE=OFF
            filter: "ShmRing*:ShmControl*:Pipeline*:Matching*"
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-14 clang-18 ninja-build libgtest-dev libssl-dev liburing-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja ${{ matrix.cmake }}
      - name: Build
        run: cmake --build build
      - name: Test
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          TSAN_OPTIONS: halt_on_error=1
        run: |
          # TSan's shadow memory doesn't fit with Ubuntu 24.04's default 32 mmap ASLR bits.
          sudo sysctl -w vm.mmap_rnd_bits=28
          setarch -R ./build/lle_tests --gtest_filter='${{ matrix.filter || '*' }}'

  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 libclang-rt-18-dev ninja-build libssl-dev g++-14 libgtest-dev
      - name: Build fuzzers
        run: |
          cmake -S . -B build-fuzz -G Ninja -DCMAKE_CXX_COMPILER=clang++-18 -DLLE_FUZZ=ON -DLLE_TESTS=OFF -DLLE_NATIVE=OFF
          cmake --build build-fuzz --target fuzz_itch fuzz_coinbase fuzz_ws fuzz_iex itch_synth iex_replay
      - name: Fuzz (60 s each)
        run: |
          mkdir -p corpus-itch
          ./build-fuzz/itch_synth --messages 40 --out corpus-itch/seed.itch
          ./build-fuzz/fuzz_itch -max_total_time=60 -max_len=4096 corpus-itch
          mkdir -p corpus-cb
          ./build-fuzz/fuzz_coinbase -max_total_time=60 -max_len=8192 corpus-cb engine/fuzz/corpus/coinbase
          ./build-fuzz/fuzz_ws -max_total_time=60 -max_len=4096
          mkdir -p corpus-iex
          ./build-fuzz/iex_replay --synth corpus-iex/seed.pcap --messages 30 --symbols-n 2
          ./build-fuzz/fuzz_iex -max_total_time=60 -max_len=4096 corpus-iex

  telemetry:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Vet and test
        working-directory: telemetry
        run: |
          go vet ./...
          go test -race ./...

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Worker tests
        working-directory: web/worker
        run: |
          npm ci
          npm test
      - name: UI build
        working-directory: web/ui
        run: |
          npm ci
          npm run build
